summary: Launch a workshop with the Tailscale SDK and verify its binaries

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop exec -- rm -f /run/user/1000/tailscale/authorization-url || true
  workshop remove || true

execute: |
  workshop exec -- /var/lib/workshop/sdk/tailnet/bin/tailscale version | MATCH "${EXPECTED_VERSION//./\\.}"
  workshop exec -- bash -lc 'command -v tailscale' | MATCH '^/var/lib/workshop/sdk/tailnet/bin/tailscale$'
  workshop exec -- /var/lib/workshop/sdk/tailnet/bin/workshop-tailnet --help | MATCH 'authenticate'
  workshop exec -- /var/lib/workshop/sdk/tailnet/bin/workshop-tailnet --help | MATCH 'list-oauth-apps'
  workshop exec -- /var/lib/workshop/sdk/tailnet/bin/workshop-tailnet --help | MATCH 'remove-oauth-app'
  workshop exec -- test -f /etc/systemd/system/tailscaled.service
  workshop exec -- test -f /etc/systemd/system/tailscale-up.path
  workshop exec -- test -f /etc/systemd/system/tailscale-up.service
  workshop exec -- systemctl is-enabled tailscale-up.path | MATCH 'enabled'
  workshop exec -- systemctl is-active tailscale-up.path | MATCH 'active'
  workshop exec -- sh -c 'test "$(systemctl is-enabled tailscaled.service)" = enabled'
  workshop exec -- sh -c 'test "$(systemctl is-active tailscaled.service)" = active'
  # The daemon pulls the authentication flow in; its ExecCondition
  # decides from the daemon's login state whether the flow runs.
  workshop exec -- systemctl show tailscaled.service --property=Wants --value | MATCH 'tailscale-auth.service'
  workshop exec -- systemctl cat tailscale-up.service | MATCH 'auth-key=file:/run/user/1000/tailscale/auth-key'
  workshop exec -- systemctl cat tailscale-up.service | MATCH 'operator=workshop'
  workshop exec -- test -f /etc/systemd/system/tailscale-auth.service
  workshop exec -- systemctl cat tailscale-auth.service | MATCH 'ExecCondition='
  workshop exec -- systemctl is-active tailscale-auth.service | MATCH 'active'
  workshop exec -- systemctl show tailscale-auth.service --property=User --value | MATCH '^workshop$'
  workshop exec -- systemctl cat tailscale-auth.service | MATCH 'LoadCredential=tailscale.tailscale-oauth-app:/var/lib/workshop/run/workshop.socket.secret'
  workshop exec -- test ! -e /home/workshop/.config/systemd/user/tailscale-auth.service
  workshop exec -- mkdir -p /run/user/1000/tailscale
  workshop exec -- sh -c 'printf "%s\n" "https://example.com/oauth" > /run/user/1000/tailscale/authorization-url'
  # Reproduce how "workshop shell" starts a session: a non-interactive login
  # shell attached to a terminal. "script" provides the terminal.
  workshop exec -- script -qec 'bash -l -c "exec -- bash -c true"' /dev/null | MATCH 'Tailscale authentication is required'
  workshop exec -- script -qec 'bash -l -c "exec -- bash -c true"' /dev/null | MATCH 'https://example.com/oauth'
  # Batch exec runs without a terminal and must stay silent.
  workshop exec -- bash -lic true | NOMATCH 'Tailscale authentication is required'
  workshop info | MATCH 'status:\s+ready'

debug: |
  workshop exec -- /var/lib/workshop/sdk/tailnet/bin/tailscale version || true
  workshop info || true
